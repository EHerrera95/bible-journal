<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bible Journal{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink:        #1c1712;
            --ink-soft:   #3d3529;
            --ink-muted:  #7a6e62;
            --parchment:  #f5f0e8;
            --parchment-dark: #ede6d6;
            --parchment-mid:  #e8dfc8;
            --cream:      #faf7f2;
            --gold:       #b5862e;
            --gold-light: #d4a84b;
            --gold-pale:  #f0e4c4;
            --rust:       #8b3a2a;
            --sage:       #5a6e5a;
            --rule:       rgba(181, 134, 46, 0.25);
            --shadow-sm:  0 1px 4px rgba(28,23,18,0.08);
            --shadow-md:  0 4px 20px rgba(28,23,18,0.12);
            --shadow-lg:  0 8px 40px rgba(28,23,18,0.16);
            --radius:     4px;
            --radius-lg:  8px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: 'Lora', Georgia, serif;
            background-color: var(--cream);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.75;
            background-image: repeating-linear-gradient(
                transparent, transparent 27px,
                rgba(181,134,46,0.08) 27px,
                rgba(181,134,46,0.08) 28px
            );
        }

        /* Nav */
        .nav {
            background: var(--ink);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(28,23,18,0.4);
        }
        .nav-brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-style: italic;
            color: var(--gold-light);
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        .nav-brand span { font-style: normal; color: var(--parchment); font-weight: 600; }
        .nav-links { display: flex; align-items: center; gap: 1.25rem; list-style: none; }
        .nav-links a {
            font-family: 'Crimson Pro', serif;
            font-size: 0.92rem;
            color: var(--parchment-mid);
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--gold-light); }
        .nav-logout-btn {
            background: none;
            border: 1px solid rgba(181,134,46,0.4);
            color: var(--parchment-mid);
            font-family: 'Crimson Pro', serif;
            font-size: 0.92rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius);
            transition: all 0.2s;
        }
        .nav-logout-btn:hover { border-color: var(--gold-light); color: var(--gold-light); }

        /* Layout */
        .page-wrapper { max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

        /* Page Header */
        .page-header { margin-bottom: 2.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--rule); position: relative; }
        .page-header::after {
            content: '✦';
            position: absolute;
            bottom: -0.6em; left: 50%;
            transform: translateX(-50%);
            color: var(--gold); font-size: 0.75rem;
            background: var(--cream); padding: 0 0.5rem;
        }
        .page-title { font-family: 'Playfair Display', serif; font-size: 2.1rem; font-weight: 700; color: var(--ink); line-height: 1.2; }
        .page-subtitle { font-family: 'Crimson Pro', serif; font-size: 1.05rem; color: var(--ink-muted); margin-top: 0.4rem; font-style: italic; }

        /* Card */
        .card { background: var(--parchment); border: 1px solid var(--parchment-mid); border-radius: var(--radius-lg); padding: 1.75rem 2rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
        .card-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 600; color: var(--ink); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        .card-title .icon { color: var(--gold); font-size: 0.9em; }

        /* Plan Card */
        .plan-card { background: var(--parchment); border-left: 3px solid var(--gold); border-radius: 0 var(--radius-lg) var(--radius-lg) 0; padding: 1.5rem 2rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem; }
        .plan-label { font-family: 'Crimson Pro', serif; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem; }
        .plan-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 600; color: var(--ink); }
        .plan-day-badge { display: inline-block; background: var(--gold-pale); border: 1px solid rgba(181,134,46,0.35); color: var(--ink-soft); font-family: 'Crimson Pro', serif; font-size: 0.85rem; padding: 0.2rem 0.7rem; border-radius: 20px; margin-top: 0.5rem; }

        /* Passage */
        .passage-ref { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-style: italic; color: var(--ink-soft); }
        .key-verse-block { background: var(--gold-pale); border-left: 3px solid var(--gold); padding: 0.75rem 1.25rem; border-radius: 0 var(--radius) var(--radius) 0; margin-top: 0.75rem; font-family: 'Lora', serif; font-style: italic; color: var(--ink-soft); font-size: 0.95rem; }

        /* SOAP Form */
        .soap-form { display: flex; flex-direction: column; gap: 1.5rem; }
        .soap-field { background: var(--parchment); border: 1px solid var(--parchment-mid); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow 0.2s; }
        .soap-field:focus-within { box-shadow: 0 0 0 2px rgba(181,134,46,0.3), var(--shadow-sm); }
        .soap-label { display: block; background: var(--parchment-dark); border-bottom: 1px solid var(--parchment-mid); padding: 0.6rem 1rem; font-family: 'Crimson Pro', serif; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
        .soap-letter { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--gold); margin-right: 0.4rem; }
        .soap-field textarea { width: 100%; min-height: 130px; padding: 1rem; background: transparent; border: none; outline: none; resize: vertical; font-family: 'Lora', serif; font-size: 0.95rem; color: var(--ink); line-height: 1.8; }
        .soap-field textarea::placeholder { color: var(--ink-muted); font-style: italic; }

        /* Buttons */
        .btn { display: inline-block; font-family: 'Crimson Pro', serif; font-size: 1rem; letter-spacing: 0.06em; text-decoration: none; padding: 0.65rem 1.75rem; border-radius: var(--radius); cursor: pointer; transition: all 0.2s; border: none; }
        .btn-primary { background: var(--ink); color: var(--parchment); }
        .btn-primary:hover { background: var(--ink-soft); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .btn-gold { background: var(--gold); color: var(--cream); }
        .btn-gold:hover { background: var(--gold-light); box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--parchment-mid); }
        .btn-ghost:hover { border-color: var(--ink-muted); color: var(--ink); }

        /* Links */
        a { color: var(--rust); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--gold); }
        .back-link { font-family: 'Crimson Pro', serif; font-size: 0.9rem; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 2rem; }
        .back-link:hover { color: var(--ink); }

        /* Divider */
        .divider { display: flex; align-items: center; gap: 1rem; margin: 2rem 0; color: var(--gold); font-size: 0.7rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

        /* History Table */
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .history-table thead th { font-family: 'Crimson Pro', serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); text-align: left; padding: 0.5rem 1rem; border-bottom: 1px solid var(--parchment-mid); }
        .history-table tbody tr { border-bottom: 1px solid rgba(181,134,46,0.1); transition: background 0.15s; }
        .history-table tbody tr:hover { background: var(--gold-pale); }
        .history-table td { padding: 0.85rem 1rem; color: var(--ink-soft); vertical-align: top; }
        .history-table .date-cell { font-family: 'Crimson Pro', serif; white-space: nowrap; color: var(--ink-muted); font-size: 0.85rem; }
        .history-table .plan-cell { font-family: 'Crimson Pro', serif; font-size: 0.85rem; color: var(--gold); }

        /* Alerts */
        .alert { padding: 0.75rem 1rem; border-radius: var(--radius); font-family: 'Crimson Pro', serif; font-size: 0.95rem; margin-bottom: 1rem; }
        .alert-error { background: #fdf0ee; border: 1px solid #e0b8b2; color: var(--rust); }

        /* Login */
        .login-wrap { max-width: 420px; margin: 0 auto; }
        .form-field { margin-bottom: 1.25rem; }
        .form-field label { display: block; font-family: 'Crimson Pro', serif; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 0.4rem; }
        .form-field input { width: 100%; padding: 0.65rem 0.9rem; background: var(--parchment); border: 1px solid var(--parchment-mid); border-radius: var(--radius); font-family: 'Lora', serif; font-size: 0.95rem; color: var(--ink); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-field input:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(181,134,46,0.2); }

        /* Snippets */
        .snippet { font-family: 'Lora', serif; font-size: 0.9rem; color: var(--ink-soft); font-style: italic; line-height: 1.7; }
        .snippet-label { font-style: normal; font-family: 'Crimson Pro', serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); display: block; margin-bottom: 0.25rem; }

        /* Empty state */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--ink-muted); }
        .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.5; }
        .empty-state p { font-family: 'Crimson Pro', serif; font-size: 1.05rem; font-style: italic; }

        /* Action row */
        .action-row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 1.5rem; }

        /* Responsive */
        @media (max-width: 600px) {
            .page-wrapper { padding: 2rem 1rem 4rem; }
            .page-title { font-size: 1.6rem; }
            .card, .plan-card { padding: 1.25rem; }
            .nav { padding: 0 1rem; }
            .nav-links { gap: 0.75rem; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a class="nav-brand" href="{% url 'home' %}"><span>Bible</span> Journal</a>
        {% if user.is_authenticated %}
        <ul class="nav-links">
            <li><a href="{% url 'today' %}">Today</a></li>
            <li><a href="{% url 'journal_free' %}">Free Entry</a></li>
            <li><a href="{% url 'progress' %}">Progress</a></li>
            <li><a href="{% url 'journal_history' %}">History</a></li>
            <li>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="nav-logout-btn">Log out</button>
                </form>
            </li>
        </ul>
        {% endif %}
    </nav>

    <main class="page-wrapper">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
